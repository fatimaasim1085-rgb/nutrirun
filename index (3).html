<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition and Applied Dietetics Quiz - 500 MCQs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .difficulty-selector {
            text-align: center;
            margin-bottom: 30px;
        }
        .difficulty-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            color: white;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .difficulty-btn:hover, .difficulty-btn.active {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .quiz-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .question {
            display: none;
            margin-bottom: 25px;
            padding: 20px;
            border-left: 5px solid #667eea;
            background: #f8f9ff;
            border-radius: 10px;
        }
        .question.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .question-number {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #333;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {
            margin-bottom: 12px;
            padding: 15px;
            background: white;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }
        .options li:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateX(5px);
        }
        .options li.selected {
            border-color: #28a745;
            background: #d4edda;
            font-weight: bold;
        }
        .options li.correct {
            border-color: #28a745;
            background: #d4edda;
        }
        .options li.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }
        .nav-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .nav-btn:hover:not(:disabled), .nav-btn:focus:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .score {
            font-size: 1.3em;
            font-weight: bold;
            color: #28a745;
        }
        .progress {
            width: 100%;
            height: 10px;
            background: #e1e5e9;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        .results {
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border-radius: 20px;
            display: none;
        }
        .results.show {
            display: block;
            animation: fadeIn 0.8s ease-in;
        }
        .restart-btn {
            background: white;
            color: #28a745;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: #333;
        }
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍎 Nutrition & Applied Dietetics Quiz</h1>
        <p>500 Multiple-Choice Questions | Easy (100) • Medium (250) • Hard (150)</p>
    </div>

    <div class="difficulty-selector">
        <button class="difficulty-btn active" data-difficulty="easy">Easy (100 Qs)</button>
        <button class="difficulty-btn" data-difficulty="medium">Medium (250 Qs)</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard (150 Qs)</button>
    </div>

    <div class="quiz-container">
        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        
        <div id="quizArea"></div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
            <div class="score" id="score">Score: 0 / 0</div>
            <button class="nav-btn" id="nextBtn">Next →</button>
        </div>
    </div>

    <div class="results" id="results">
        <h2 id="finalScore"></h2>
        <div class="stats" id="stats"></div>
        <button class="restart-btn" onclick="restartQuiz()">🔄 Restart Quiz</button>
    </div>

    <script>
